<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:16px}.box{fill:#f7f9fb;stroke:#315b7d;stroke-width:2}.ok{fill:#eef8ee;stroke:#397a42;stroke-width:2}.warn{fill:#fff6df;stroke:#b77a00;stroke-width:2}.line{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker></defs><text x="40" y="45" class="h">Partcounter R001.25 – bestätigter LOGO!-Command/Ack- und VE-Grenzablauf</text><rect x="40" y="90" width="240" height="90" rx="8" class="box"/><text x="70" y="125" class="t">PC: CommandSequence n</text><text x="70" y="155" class="s">HR2 + CommandWord/Parameter</text><rect x="360" y="90" width="260" height="90" rx="8" class="box"/><text x="395" y="125" class="t">LOGO!: n != Ack?</text><text x="395" y="155" class="s">One-Shot höchstens einmal</text><rect x="700" y="90" width="260" height="90" rx="8" class="ok"/><text x="735" y="125" class="t">LOGO!: ausführen</text><text x="735" y="155" class="s">danach AckSequence = n</text><rect x="1040" y="90" width="300" height="90" rx="8" class="ok"/><text x="1070" y="125" class="t">PC: ACK n + ErrorCode 0</text><text x="1070" y="155" class="s">erst jetzt Befehl erfolgreich</text><path d="M280 135 H360" class="line"/><path d="M620 135 H700" class="line"/><path d="M960 135 H1040" class="line"/><rect x="40" y="245" width="300" height="90" rx="8" class="warn"/><text x="70" y="280" class="t">VE abgeschlossen</text><text x="70" y="310" class="s">CompletionSequence neu</text><rect x="410" y="245" width="250" height="90" rx="8" class="box"/><text x="455" y="280" class="t">PauseCounting</text><text x="455" y="310" class="s">ACK abwarten</text><rect x="730" y="245" width="300" height="90" rx="8" class="box"/><text x="770" y="280" class="t">nächstes VE-Ziel</text><text x="770" y="310" class="s">pause=true + ACK</text><rect x="1100" y="245" width="240" height="90" rx="8" class="ok"/><text x="1140" y="280" class="t">ResumeCounting</text><text x="1140" y="310" class="s">nur bei Running</text><path d="M340 290 H410" class="line"/><path d="M660 290 H730" class="line"/><path d="M1030 290 H1100" class="line"/><rect x="280" y="410" width="840" height="125" rx="8" class="warn"/><text x="330" y="450" class="t">Timeout / TCP-Abbruch</text><text x="330" y="485" class="s">Bis zu 3 Versuche; derselbe Sequenzwert wird erneut gesendet.</text><text x="330" y="515" class="s">Ein bereits ausgeführter One-Shot darf dadurch nicht doppelt wirken.</text><text x="40" y="590" class="s">Safety: Partcounter/LOGO! bleiben nicht-sicherheitsgerichtet.</text></svg>
