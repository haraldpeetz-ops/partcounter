name: Build Partcounter R001.18

on:
  push:
    branches: [ r001.18-label-snapshot-als-hotfix ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_18_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_18_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_18_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_18_SingleFile_win-x64'
          )

          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_14.md "$target/Engineering/" -Force
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_18' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_18/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_18/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_14.md 'artifacts/Engineering_R001_18/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.18
          ===================

          New in R001.18:
          - ARBURG ALS field-mapping binding hotfix for read-only Required/TargetField/Description/Example fields
          - immutable label template snapshot per regularly printed VE
          - embedded logos/images are part of the archived label definition
          - SHA-256 verification of historical label snapshots before reprint
          - reprint prefers the original archived layout snapshot
          - older VEs without snapshot use an explicitly logged current-layout fallback
          - reprint journal records the layout source for each attempt

          Retained:
          - R001.17 label reprint and reprint journal
          - R001.16 read-only live commissioning measurement
          - R001.15 automatic database backup and diagnostics
          - R001.14 About, integrated help and update center
          - R001.13 configurable company logo
          - R001.12 operator/admin separation
          - R001.11 label image/logo support
          - Modbus Protocol V2 and Partcounter_LOGO_V001 unchanged

          Data: %LOCALAPPDATA%\Partcounter
          Backups: %LOCALAPPDATA%\Partcounter\Backups
          Diagnostics: %LOCALAPPDATA%\Partcounter\Diagnostics
          Updates: %LOCALAPPDATA%\Partcounter\Updates
          Startup log: %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_18_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_18_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_18_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_18'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_18_SingleFile_win-x64/*' $payload -Recurse -Force

          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.18'
            revision = 'R001.18'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.18: ARBURG-ALS-Feldmapping-Hotfix sowie SHA-256-geprüfte historische Etiketten-Layout-Snapshots für reproduzierbare Nachdrucke.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_18_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_18_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_18_SingleFile_win-x64
          path: artifacts/Partcounter_R001_18_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_18_Engineering
          path: artifacts/Engineering_R001_18
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_18_UpdatePackage
          path: artifacts/UpdatePackage_R001_18
          if-no-files-found: error
          retention-days: 30
