name: Build Partcounter R001.24

on:
  push:
    branches: [ r001.24-adaptive-ui-logo-guide ]
  workflow_dispatch:

jobs:
  build-validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_24_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_24_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Real WPF simulation stress test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/Validation_R001_24' | Out-Null
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_24_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_24').Path 'STRESS_REPORT_R001_24.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--stress-smoke', "--stress-report=$report" -PassThru
          if (-not $process.WaitForExit(360000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter stress test exceeded 360 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Stress report missing. ExitCode=$($process.ExitCode)"
          }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Partcounter stress test failed with ExitCode $($process.ExitCode)."
          }
          if (-not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Stress report did not contain PASS.'
          }

      - name: Multi-resolution WPF layout smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_24_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_24').Path 'LAYOUT_REPORT_R001_24.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--layout-smoke', "--layout-report=$report" -PassThru
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter layout smoke test exceeded 300 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Layout report missing. ExitCode=$($process.ExitCode)"
          }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Partcounter layout smoke test failed with ExitCode $($process.ExitCode)."
          }
          if (-not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Layout report did not contain PASS.'
          }

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_24_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_24_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md "$target/Engineering/" -Force
            Copy-Item artifacts/Validation_R001_24/*.txt "$target/Engineering/" -Force
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_24' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_24/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_24/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md 'artifacts/Engineering_R001_24/' -Force
          Copy-Item artifacts/Validation_R001_24/*.txt 'artifacts/Engineering_R001_24/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.24
          ===================

          R001.24 focuses on stable operation on notebooks, small displays and Windows DPI scaling.
          - central AdaptiveUiService for all WPF windows
          - explicit PerMonitorV2 DPI awareness
          - windows are constrained to the available Windows work area
          - historical oversized MinWidth/MinHeight values are neutralized at runtime when necessary
          - DataGrid horizontal/vertical scroll paths are enforced
          - large fixed layout columns are compacted conservatively on narrow viewports
          - Leitstand machine tile columns adapt from 1 to 5 columns based on available width
          - compact header breakpoints prevent title/status/control overlap
          - automated layout validation exercises 800x500, 1024x600, 1280x720, 1366x768, 1600x900 and 1920x1080 logical WPF viewports
          - R001.23 runtime stress validation remains mandatory

          The LOGO! engineering guide is included in the Engineering documentation.
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_24_SingleFile_win-x64/START_HINWEIS.txt
          Copy-Item artifacts/Partcounter_R001_24_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_24_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_24'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_24_SingleFile_win-x64/*' $payload -Recurse -Force
          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.24'
            revision = 'R001.24'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.24: adaptive, DPI-stabile WPF-Oberfläche für Notebook- und Desktopauflösungen plus validierter LOGO!-Engineering-Leitfaden.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_24_ValidationReports
          path: artifacts/Validation_R001_24
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_24_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_24_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_24_SingleFile_win-x64
          path: artifacts/Partcounter_R001_24_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_24_Engineering
          path: artifacts/Engineering_R001_24
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_24_UpdatePackage
          path: artifacts/UpdatePackage_R001_24
          if-no-files-found: error
          retention-days: 30
