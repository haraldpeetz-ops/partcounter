name: Build Partcounter R001.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_6_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_6_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.6
          ==================

          SINGLE-FILE VERSION:
          Start Partcounter.exe directly. No .NET installation is required.

          New in R001.6:
          - right-click context menu on machine tiles: pause / resume / end / temporarily disable
          - ARBURG ALS order import via XLSX/CSV/TSV hotfolder or configurable REST/JSON endpoint
          - freely configurable ALS field mapping and machine alias mapping
          - optional article master creation/update from ALS order fields
          - optional automatic ALS polling
          - Windows-DPAPI protected storage for REST passwords/tokens/API keys/certificate passwords
          - detailed R001.6 manual and Modbus configuration documentation in repository docs

          IMPORTANT:
          ALS REST endpoint, authentication and JSON schema are installation-specific. Obtain the actual
          endpoint/schema from your ALS administrator or ARBURG ALS Support and map the supplied fields
          in the ARBURG ALS tab before productive use.

          If startup fails, Partcounter writes:
          %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_6_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_6_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_6_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_6_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_6_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_6_SingleFile_win-x64
          path: artifacts/Partcounter_R001_6_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30
