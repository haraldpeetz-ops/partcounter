name: Build Partcounter R001.9

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_9_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_9_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add LOGO V001 and commissioning engineering package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_9_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_9_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/LOGO_V001_Engineering" | Out-Null
            Copy-Item docs/logo_v001/* "$target/LOGO_V001_Engineering/" -Recurse
            Copy-Item docs/MODBUS_REGISTER_MAP.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/LOGO_CONTROL_LOGIC.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/REFERENCE_MACHINE_01_HARDWARE.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/COMMISSIONING_TEST_PROTOCOL_R001_7.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/COMMISSIONING_CENTER_R001_9.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/PROJECT_STATUS_R001_9_CHECKPOINT.md "$target/LOGO_V001_Engineering/"
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Commissioning_R001_9' | Out-Null
          Copy-Item docs/REFERENCE_MACHINE_01_HARDWARE.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/COMMISSIONING_TEST_PROTOCOL_R001_7.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/COMMISSIONING_CENTER_R001_9.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/PROJECT_STATUS_R001_9_CHECKPOINT.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/MODBUS_REGISTER_MAP.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/LOGO_CONTROL_LOGIC.md 'artifacts/Commissioning_R001_9/'
          Copy-Item docs/logo_v001/* 'artifacts/Commissioning_R001_9/' -Recurse

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.9
          ==================

          New in R001.9 - Commissioning & Diagnostics:
          - dedicated commissioning/diagnostics center per machine
          - live Modbus session diagnostics without a second polling worker
          - PC heartbeat, LOGO heartbeat, CommandSequence/AckSequence
          - StatusWord decoding and ErrorCode clear text
          - direct read-only Modbus probe (no output switching, no parameter write)
          - machine hardware profile and release state
          - guided commissioning checklist persisted in SQLite
          - per-machine CSV commissioning protocol export
          - 30-machine rollout overview with live state, release status and checklist progress
          - rollout overview CSV export
          - Station 01 reference profile: Siemens 6ED1052-2MD08-0BA2, I1 24 V, Q1 interface relay, optional I2

          COMMISSIONING EXPORTS:
          Documents\Partcounter\Inbetriebnahme

          LOGO V001 engineering files remain in:
          LOGO_V001_Engineering

          IMPORTANT:
          The diagnostics read probe is read-only. Physical Q1/valve testing remains a controlled
          commissioning step using the approved LOGO! program, wiring and test protocol.

          If startup fails, Partcounter writes:
          %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_9_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_9_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_9_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_9_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_9_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_9_SingleFile_win-x64
          path: artifacts/Partcounter_R001_9_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload commissioning engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_9_Commissioning_Engineering
          path: artifacts/Commissioning_R001_9
          if-no-files-found: error
          retention-days: 30
