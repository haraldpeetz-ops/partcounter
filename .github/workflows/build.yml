name: Build Partcounter R001.7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_7_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_7_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.7
          ==================

          SINGLE-FILE VERSION:
          Start Partcounter.exe directly. No .NET installation is required.

          New in R001.7:
          - command-sequence synchronization with the LOGO! AckSequence after PC restart
          - Partcounter Modbus protocol V2 aligned to native LOGO! counter capabilities
          - LOGO! transfers VE-cycle counters as DWORD values; the PC calculates part quantities
          - separate LastCompletedCavities value for unambiguous completed-VE reconstruction
          - detailed Partcounter_LOGO_V001 engineering specification and commissioning basis

          IMPORTANT:
          Partcounter protocol V2 requires the matching Partcounter_LOGO_V001 program/register map.
          Do not connect an older protocol-V1 LOGO! program to this build for productive operation.

          If startup fails, Partcounter writes:
          %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_7_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_7_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_7_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_7_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_7_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_7_SingleFile_win-x64
          path: artifacts/Partcounter_R001_7_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30
