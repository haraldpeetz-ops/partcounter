name: Build Partcounter R001.13

on:
  push:
    branches: [ r001.13-company-logo ]
  pull_request:
    branches: [ r001.12-admin-protection ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_13_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_13_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_13_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_13_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse
            Copy-Item docs/MODBUS_REGISTER_MAP.md "$target/Engineering/"
            Copy-Item docs/LOGO_CONTROL_LOGIC.md "$target/Engineering/"
            Copy-Item docs/REFERENCE_MACHINE_01_HARDWARE.md "$target/Engineering/"
            Copy-Item docs/COMMISSIONING_TEST_PROTOCOL_R001_7.md "$target/Engineering/"
            Copy-Item docs/COMMISSIONING_CENTER_R001_9.md "$target/Engineering/"
            Copy-Item docs/PROJECT_STATUS_R001_9_CHECKPOINT.md "$target/Engineering/"
            Copy-Item docs/LABEL_DESIGNER_R001_10.md "$target/Engineering/"
            Copy-Item docs/LABEL_DESIGNER_R001_11.md "$target/Engineering/"
            Copy-Item docs/ADMIN_ACCESS_R001_12.md "$target/Engineering/"
            Copy-Item docs/COMPANY_BRANDING_R001_13.md "$target/Engineering/"
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_13' | Out-Null
          Copy-Item docs/REFERENCE_MACHINE_01_HARDWARE.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/COMMISSIONING_TEST_PROTOCOL_R001_7.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/COMMISSIONING_CENTER_R001_9.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/PROJECT_STATUS_R001_9_CHECKPOINT.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/MODBUS_REGISTER_MAP.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/LOGO_CONTROL_LOGIC.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/LABEL_DESIGNER_R001_10.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/LABEL_DESIGNER_R001_11.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/ADMIN_ACCESS_R001_12.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/COMPANY_BRANDING_R001_13.md 'artifacts/Engineering_R001_13/'
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_13/LOGO_V001' -Recurse

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.13
          ===================

          New in R001.13 - configurable company logo:
          - company logo in the upper Partcounter header / Leitstand
          - configuration in the Admin-protected Einstellungen / Druck area
          - select, replace and remove logo without changing the application build
          - PNG, JPG/JPEG, BMP, GIF and TIFF support
          - logo is copied into %LOCALAPPDATA%\Partcounter\Branding
          - original file may later be moved or deleted without losing the configured logo
          - proportional scaling in the dark header
          - no-logo fallback keeps the previous Partcounter header unchanged

          R001.12 operator/admin separation is retained.
          R001.11 label-image support is retained.
          Hardware, Modbus Protocol V2 and Partcounter_LOGO_V001 are unchanged.

          If startup fails, Partcounter writes:
          %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_13_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_13_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_13_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_13_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_13_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_13_SingleFile_win-x64
          path: artifacts/Partcounter_R001_13_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_13_Engineering
          path: artifacts/Engineering_R001_13
          if-no-files-found: error
          retention-days: 30
