name: Build Partcounter R001.8

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_8_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_8_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add LOGO V001 engineering package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_8_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_8_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/LOGO_V001_Engineering" | Out-Null
            Copy-Item docs/logo_v001/* "$target/LOGO_V001_Engineering/" -Recurse
            Copy-Item docs/MODBUS_REGISTER_MAP.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/LOGO_CONTROL_LOGIC.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/REFERENCE_MACHINE_01_HARDWARE.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/COMMISSIONING_TEST_PROTOCOL_R001_7.md "$target/LOGO_V001_Engineering/"
            Copy-Item docs/PROJECT_STATUS_R001_8_CHECKPOINT.md "$target/LOGO_V001_Engineering/"
          }

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.8
          ==================

          SINGLE-FILE VERSION:
          Start Partcounter.exe directly. No .NET installation is required.

          LOGO V001 REFERENCE STATION:
          - Siemens 6ED1052-2MD08-0BA2 / LOGO! 12/24RCEo
          - I1 = 24 V DC machine-cycle pulse
          - Q1 = 24 V DC interface relay -> 24 V DC Festo valve
          - no end-position sensor on station 01; I2 remains optional
          - valve pulse 50..5000 ms, 10 ms increments, default 750 ms
          - Modbus ProtocolVersion 2

          R001.8 includes a reproducible LOGO! Soft Comfort engineering package in:
          LOGO_V001_Engineering

          IMPORTANT:
          The package is an engineering/build specification. It intentionally does not contain an
          artificial .lsc file. Create the native Siemens project in LOGO! Soft Comfort using the
          supplied build sheet, connection netlist, VM map and test cases, then save it as the real
          Partcounter_LOGO_V001 project.

          If startup fails, Partcounter writes:
          %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_8_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_8_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_8_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_8_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_8_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_8_SingleFile_win-x64
          path: artifacts/Partcounter_R001_8_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30
