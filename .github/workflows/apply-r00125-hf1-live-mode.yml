name: Apply R001.25 HF1 Live Mode

on:
  push:
    branches: [ hotfix/r001.25.1-live-mode ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hf1-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/r001.25.1-live-mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: python tools/apply_hf1_live_mode.py
      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src/Partcounter.App/ViewModels/MainViewModel.cs src/Partcounter.App/Partcounter.App.csproj .github/workflows/build-r00125.yml
          if (git diff --cached --quiet) { Write-Host 'No patch changes required.'; exit 0 }
          git commit -m "fix: R001.25 HF1 restore reliable live-mode activation [hf1-applied]"
          git push origin HEAD:hotfix/r001.25.1-live-mode
