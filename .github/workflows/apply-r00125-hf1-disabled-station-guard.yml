name: Apply R001.25 HF1 Disabled Station Guard

on:
  push:
    branches: [ hotfix/r001.25.1-live-mode ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hf1-guard-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/r001.25.1-live-mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guard
        run: python tools/apply_hf1_disabled_station_guard.py
      - name: Commit guard
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src/Partcounter.App/ViewModels/MainViewModel.cs
          if (git diff --cached --quiet) { Write-Host 'No guard changes required.'; exit 0 }
          git commit -m "fix: block live orders on administratively disabled stations [hf1-guard-applied]"
          git push origin HEAD:hotfix/r001.25.1-live-mode
