name: Build Partcounter R001.25

on:
  push:
    branches: [ r001.25-final-hardening, main ]
  workflow_dispatch:

jobs:
  build-validate-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore with NuGet security audit
        run: dotnet restore Partcounter.sln

      - name: Build Release - warnings are errors
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Unit and regression tests
        run: dotnet test tests/Partcounter.Tests/Partcounter.Tests.csproj -c Release --no-build --logger "trx;LogFileName=R00125.trx"

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_25_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_25_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Real WPF simulation stress test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/Validation_R001_25' | Out-Null
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_25_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_25').Path 'STRESS_REPORT_R001_25.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--stress-smoke', "--stress-report=$report" -PassThru
          if (-not $process.WaitForExit(360000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter R001.25 stress test exceeded 360 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) { throw "Stress report missing. ExitCode=$($process.ExitCode)" }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Partcounter R001.25 stress test failed.'
          }

      - name: Multi-resolution WPF layout smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_25_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_25').Path 'LAYOUT_REPORT_R001_25.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--layout-smoke', "--layout-report=$report" -PassThru
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter R001.25 layout test exceeded 300 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) { throw "Layout report missing. ExitCode=$($process.ExitCode)" }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Partcounter R001.25 layout test failed.'
          }

      - name: Static final-hardening audit
        shell: pwsh
        run: |
          $audit = 'artifacts/Validation_R001_25/STATIC_AUDIT_R001_25.txt'
          "PARTCOUNTER R001.25 STATIC AUDIT" | Set-Content -LiteralPath $audit
          $stale = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml | Select-String -Pattern 'R001\.5'
          if ($stale) { $stale | Out-String | Add-Content $audit; throw 'Stale R001.5 UI reference found.' }
          $unfinished = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml | Select-String -Pattern 'TODO|FIXME|NotImplementedException'
          if ($unfinished) { $unfinished | Out-String | Add-Content $audit; throw 'Unfinished code marker found.' }
          "PASS" | Add-Content -LiteralPath $audit

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_25_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_25_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25.md "$target/Engineering/" -Force
            Copy-Item artifacts/Validation_R001_25/*.txt "$target/Engineering/" -Force
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_25' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_25/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_25/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25.md 'artifacts/Engineering_R001_25/' -Force
          Copy-Item artifacts/Validation_R001_25/*.txt 'artifacts/Engineering_R001_25/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.25 - FINAL HARDENING
          ====================================

          Industrial hardening baseline:
          - .NET 10 LTS
          - compiler warnings fail the build
          - confirmed LOGO CommandSequence/AckSequence handshake with same-sequence retry
          - LOGO ErrorCode and parameter echo validation
          - safe VE boundary: Pause -> confirmed target -> Resume
          - process-wide serialized SQLite writers
          - 24/7 daily backup check every 30 minutes
          - productive order source is exclusively ARBURG ALS or proALPHA
          - DPAPI protected secrets
          - optional Authenticode enforcement for future signed packages
          - unit/regression tests plus WPF stress and multi-resolution layout gates

          IMPORTANT: Production release still requires real M01 hardware acceptance.
          Data: %LOCALAPPDATA%\Partcounter
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_25_SingleFile_win-x64/START_HINWEIS.txt
          Copy-Item artifacts/Partcounter_R001_25_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_25_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_25'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_25_SingleFile_win-x64/*' $payload -Recurse -Force
          $payloadRoot = (Resolve-Path $payload).Path
          Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII
          [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.25'
            revision = 'R001.25'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            requireAuthenticode = $false
            publisherCertificateThumbprint = ''
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.25 Final Hardening - industrial release candidate; real M01 acceptance still required.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_ValidationReports
          path: |
            artifacts/Validation_R001_25
            tests/Partcounter.Tests/TestResults
          if-no-files-found: warn
          retention-days: 90

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_25_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 90

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_SingleFile_win-x64
          path: artifacts/Partcounter_R001_25_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 90

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_Engineering
          path: artifacts/Engineering_R001_25
          if-no-files-found: error
          retention-days: 90

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_UpdatePackage
          path: artifacts/UpdatePackage_R001_25
          if-no-files-found: error
          retention-days: 90
