name: Build Partcounter R001.25

on:
  push:
    branches: [ r001.25-final-hardening, main, 'hotfix/**' ]
  workflow_dispatch:

jobs:
  build-validate-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore with NuGet security audit
        run: dotnet restore Partcounter.sln

      - name: Build Release - warnings are errors
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Unit and regression tests
        run: dotnet test tests/Partcounter.Tests/Partcounter.Tests.csproj -c Release --no-build --logger "trx;LogFileName=R00125.trx"

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_25_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_25_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Real WPF simulation stress test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/Validation_R001_25' | Out-Null
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_25_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_25').Path 'STRESS_REPORT_R001_25.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--stress-smoke', "--stress-report=$report" -PassThru
          if (-not $process.WaitForExit(360000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter R001.25 stress test exceeded 360 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) { throw "Stress report missing. ExitCode=$($process.ExitCode)" }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Partcounter R001.25 stress test failed.'
          }

      - name: Multi-resolution WPF layout smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_25_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Validation_R001_25').Path 'LAYOUT_REPORT_R001_25.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--layout-smoke', "--layout-report=$report" -PassThru
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter R001.25 layout test exceeded 300 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) { throw "Layout report missing. ExitCode=$($process.ExitCode)" }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Partcounter R001.25 layout test failed.'
          }

      - name: Static final-hardening and engineering audit
        shell: pwsh
        run: |
          $audit = 'artifacts/Validation_R001_25/STATIC_AUDIT_R001_25.txt'
          "PARTCOUNTER R001.25 STATIC + ENGINEERING AUDIT" | Set-Content -LiteralPath $audit

          $stale = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml | Select-String -Pattern 'R001\.5'
          if ($stale) { $stale | Out-String | Add-Content $audit; throw 'Stale R001.5 UI reference found.' }

          $unfinished = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml | Select-String -Pattern 'TODO|FIXME|NotImplementedException'
          if ($unfinished) { $unfinished | Out-String | Add-Content $audit; throw 'Unfinished code marker found.' }

          $registerMap = Get-Content 'src/Partcounter.App/Services/ModbusRegisterMap.cs' -Raw
          if ($registerMap -notmatch 'ProtocolVersion\s*=\s*3;') { throw 'ProtocolVersion 3 missing from ModbusRegisterMap.' }
          if ($registerMap -notmatch 'ConfigLength\s*=\s*13;') { throw 'Protocol V3 ConfigLength 13 missing.' }
          if ($registerMap -notmatch 'StatusLength\s*=\s*21;') { throw 'Protocol V3 StatusLength 21 missing.' }
          if ($registerMap -notmatch 'StatusJobIdHiEcho' -or $registerMap -notmatch 'StatusJobIdLoEcho') { throw 'Protocol V3 JobId echo offsets missing.' }

          $helpLoader = Get-Content 'src/Partcounter.App/Services/PartcounterHelpService.cs' -Raw
          if ($helpLoader -notmatch 'PARTCOUNTER_HILFE_R001_25') { throw 'Current R001.25 help marker missing.' }
          if ($helpLoader -match 'PARTCOUNTER_HILFE_R001_19') { throw 'Help loader still references R001.19.' }

          $required = @(
            'README.md',
            'docs/MODBUS_REGISTER_MAP.md',
            'docs/LOGO_CONTROL_LOGIC.md',
            'docs/PROJECT_STATUS_R001_25_CHECKPOINT.md',
            'docs/PARTCOUNTER_LOGO_V001_R001_25_COMPLETE_ENGINEERING_GUIDE.md',
            'docs/PROTOCOL_V3_VE_BOUNDARY_DESIGN.md',
            'docs/JOB_INSTANCE_ID_R001_25.md',
            'docs/logo_v001/README_R001_25.md',
            'docs/logo_v001/LOGO_V001_VM_MAP_R001_25.csv',
            'docs/logo_v001/LOGO_V001_BLOCK_CONNECTIONS_R001_25.csv',
            'docs/logo_v001/LOGO_V001_IO_WIRING_R001_25.csv',
            'docs/logo_v001/LOGO_V001_TEST_CASES_R001_25.csv',
            'docs/logo_v001/LOGO_V001_STATION01_BUILD_SHEET_R001_25.md',
            'docs/logo_v001/STATION01_PARTCOUNTER_LOGO_V001_R001_25.ini',
            'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25.md',
            'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25_RECOVERY.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required R001.25 engineering file missing: $file" }
          }

          $vmMap = Get-Content 'docs/logo_v001/LOGO_V001_VM_MAP_R001_25.csv' -Raw
          foreach ($needle in @('HR13','VW24','HoldAfterVeNumber','HR38','VW74','HoldAfterVeNumberEcho','HR39','HR40','JobIdEcho')) {
            if ($vmMap -notmatch [regex]::Escape($needle)) { throw "Protocol V3 VM map is missing $needle" }
          }

          "Protocol V3 source contract: PASS" | Add-Content $audit
          "R001.25 help resource routing: PASS" | Add-Content $audit
          "Normative M01 engineering set: PASS" | Add-Content $audit
          "Unfinished/stale source markers: PASS" | Add-Content $audit
          "PASS" | Add-Content -LiteralPath $audit

      - name: Add current R001.25 engineering package
        shell: pwsh
        run: |
          $currentDocs = @(
            'docs/MODBUS_REGISTER_MAP.md',
            'docs/LOGO_CONTROL_LOGIC.md',
            'docs/PROJECT_STATUS_R001_25_CHECKPOINT.md',
            'docs/PARTCOUNTER_LOGO_V001_R001_25_COMPLETE_ENGINEERING_GUIDE.md',
            'docs/PROTOCOL_V3_VE_BOUNDARY_DESIGN.md',
            'docs/JOB_INSTANCE_ID_R001_25.md'
          )

          $currentNotice = @(
            'CURRENT ENGINEERING SET - R001.25 / PROTOCOL V3',
            '=================================================',
            'Only the files in this Engineering folder are current build/commissioning guidance for this package.',
            'Historical R001.8/R001.24 documents remain available in Git history/repository, but are intentionally not shipped here.',
            'Real M01 hardware acceptance remains mandatory before Production Baseline status.'
          )

          function Copy-CurrentEngineering([string]$target) {
            $engineering = Join-Path $target 'Engineering'
            $logo = Join-Path $engineering 'LOGO_V001'
            New-Item -ItemType Directory -Force -Path $engineering, $logo | Out-Null

            Copy-Item 'README.md' (Join-Path $engineering 'PROJECT_README.md') -Force
            foreach ($doc in $currentDocs) { Copy-Item $doc $engineering -Force }
            Copy-Item 'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25*.md' $engineering -Force
            Copy-Item 'docs/logo_v001/*R001_25*' $logo -Force
            Copy-Item 'docs/logo_v001/README_R001_25.md' $logo -Force
            Copy-Item 'artifacts/Validation_R001_25/*.txt' $engineering -Force
            $currentNotice | Set-Content -LiteralPath (Join-Path $engineering 'CURRENT_ENGINEERING_SET.txt') -Encoding UTF8
          }

          Copy-CurrentEngineering 'artifacts/Partcounter_R001_25_Portable_Folder_win-x64'
          Copy-CurrentEngineering 'artifacts/Partcounter_R001_25_SingleFile_win-x64'

          $standalone = 'artifacts/Engineering_R001_25'
          $logoStandalone = Join-Path $standalone 'LOGO_V001'
          New-Item -ItemType Directory -Force -Path $standalone, $logoStandalone | Out-Null
          Copy-Item 'README.md' (Join-Path $standalone 'PROJECT_README.md') -Force
          foreach ($doc in $currentDocs) { Copy-Item $doc $standalone -Force }
          Copy-Item 'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_25*.md' $standalone -Force
          Copy-Item 'docs/logo_v001/*R001_25*' $logoStandalone -Force
          Copy-Item 'docs/logo_v001/README_R001_25.md' $logoStandalone -Force
          Copy-Item 'artifacts/Validation_R001_25/*.txt' $standalone -Force
          @(
            'CURRENT ENGINEERING SET - R001.25 / PROTOCOL V3',
            '=================================================',
            'This artifact intentionally contains only the current release-candidate engineering set.',
            'Historical revision documents are retained in Git, not mixed into the commissioning package.'
          ) | Set-Content -LiteralPath (Join-Path $standalone 'CURRENT_ENGINEERING_SET.txt') -Encoding UTF8

      - name: Add start instructions
        shell: pwsh
        run: |
          @(
            'PARTCOUNTER R001.25 - PRODUCTION RELEASE CANDIDATE',
            '==================================================',
            '',
            'Industrial hardening baseline:',
            '- .NET 10 LTS',
            '- compiler warnings fail the build',
            '- NuGet security audit is mandatory',
            '- LOGO! Modbus TCP Protocol V3',
            '- confirmed CommandSequence/AckSequence handshake with same-sequence retry',
            '- ErrorCode + cavities + HoldAfterVE + JobId echo validation',
            '- deterministic LOGO-side CompletionHold prevents boundary leakage cycles',
            '- unique persisted production JobId per real order activation',
            '- PendingActivation protects uncertain command outcomes',
            '- 24/7 restart recovery restores real jobs PAUSED and never auto-resumes',
            '- process-wide serialized SQLite writers',
            '- 24/7 daily backup check every 30 minutes',
            '- productive order source is exclusively ARBURG ALS or proALPHA',
            '- DPAPI protected secrets and hardened X509/mTLS path',
            '- unit/regression tests plus WPF stress and multi-resolution layout gates',
            '',
            'IMPORTANT:',
            'This package is a software Production Release Candidate.',
            'Production Baseline status still requires successful real M01 hardware acceptance.',
            '',
            'Data: %LOCALAPPDATA%\Partcounter',
            'Current engineering: Engineering\'
          ) | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_25_SingleFile_win-x64/START_HINWEIS.txt
          Copy-Item artifacts/Partcounter_R001_25_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_25_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_25'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_25_SingleFile_win-x64/*' $payload -Recurse -Force
          $payloadRoot = (Resolve-Path $payload).Path
          Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII
          [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.25'
            revision = 'R001.25'
            architecture = 'win-x64'
            protocol = 'Modbus TCP Protocol V3'
            releaseStage = 'Production Release Candidate'
            payloadRoot = 'payload/'
            requireAuthenticode = $false
            publisherCertificateThumbprint = ''
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.25 Final Hardening / Protocol V3. Real M01 hardware acceptance remains required before Production Baseline status.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_ValidationReports
          path: |
            artifacts/Validation_R001_25
            tests/Partcounter.Tests/TestResults
          if-no-files-found: warn
          retention-days: 90

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_25_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 90

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_SingleFile_win-x64
          path: artifacts/Partcounter_R001_25_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 90

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_Engineering
          path: artifacts/Engineering_R001_25
          if-no-files-found: error
          retention-days: 90

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_25_UpdatePackage
          path: artifacts/UpdatePackage_R001_25
          if-no-files-found: error
          retention-days: 90
