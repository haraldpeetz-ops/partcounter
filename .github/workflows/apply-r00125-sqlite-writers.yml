name: Apply R001.25 SQLite writer unification

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-sqlite]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/fix_r00125_all_sqlite_writers.py
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src/Partcounter.App/Services/LabelPrintSnapshotService.cs src/Partcounter.App/Services/LabelReprintService.cs src/Partcounter.App/Services/LabelTemplateService.cs src/Partcounter.App/Services/CommissioningDatabaseService.cs
          git commit -m "fix: route all production SQLite writes through coordinator [sqlite-applied]"
          git push origin HEAD:r001.25-final-hardening
