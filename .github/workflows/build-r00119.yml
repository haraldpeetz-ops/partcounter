name: Build Partcounter R001.19

on:
  push:
    branches: [ r001.19-help-professional ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_19_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_19_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_19_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_19_SingleFile_win-x64'
          )

          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md "$target/Engineering/" -Force
            Copy-Item src/Partcounter.App/Help/Screenshots "$target/Engineering/Help_Screenshots" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_19' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_19/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_19/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md 'artifacts/Engineering_R001_19/' -Force
          Copy-Item src/Partcounter.App/Help/Screenshots 'artifacts/Engineering_R001_19/Help_Screenshots' -Recurse -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.19
          ===================

          New in R001.19:
          - professional expanded integrated help covering production, engineering and troubleshooting
          - F1 context help opens the topic for the currently selected Partcounter area
          - separate full Help button and Area Help (F1) button in the header
          - formatted WPF help documents with headings, numbered procedures and highlighted warnings/practical notes
          - screenshot slot for every major help topic
          - automatic loading of original PNG/JPG screenshots from Help/Screenshots
          - clear screenshot capture instruction when an original screenshot is not yet available
          - copyable screenshot capture instructions
          - screenshot capture plan for the future illustrated PDF/manual

          Retained:
          - R001.18 ARBURG ALS read-only binding hotfix and historical label-layout snapshots
          - R001.17 label reprint and reprint journal
          - R001.16 read-only live commissioning measurement
          - R001.15 automatic database backup and diagnostics
          - R001.14 About and update center
          - R001.13 configurable company logo
          - R001.12 operator/admin separation
          - R001.11 label image/logo support
          - Modbus Protocol V2 and Partcounter_LOGO_V001 unchanged

          Data: %LOCALAPPDATA%\Partcounter
          Backups: %LOCALAPPDATA%\Partcounter\Backups
          Diagnostics: %LOCALAPPDATA%\Partcounter\Diagnostics
          Updates: %LOCALAPPDATA%\Partcounter\Updates
          Startup log: %LOCALAPPDATA%\Partcounter\Partcounter_startup.log
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_19_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_19_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_19_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_19'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_19_SingleFile_win-x64/*' $payload -Recurse -Force

          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.19'
            revision = 'R001.19'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.19: professionelle kontextbezogene F1-Hilfe mit formatierter Dokumentansicht, ausführlicher Fehlersuche und vorbereiteten Original-Screenshot-Slots.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_19_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_19_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_19_SingleFile_win-x64
          path: artifacts/Partcounter_R001_19_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_19_Engineering
          path: artifacts/Engineering_R001_19
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_19_UpdatePackage
          path: artifacts/UpdatePackage_R001_19
          if-no-files-found: error
          retention-days: 30
