name: Build Partcounter R001.21

on:
  push:
    branches: [ r001.21-support-version-core ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_21_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_21_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_21_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_21_SingleFile_win-x64'
          )

          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md "$target/Engineering/" -Force
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_21' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_21/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_21/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md 'artifacts/Engineering_R001_21/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.21
          ===================

          New in R001.21:
          - central assembly-based version source for visible program revision
          - automatic normalization of stale visible revision labels in WPF windows
          - new 'Bedienung & Support' center in the main header
          - integrated database health check and backup status
          - current-version support/diagnostic ZIP package
          - guided direct links into the existing F1 help topics
          - support information copy function without passwords/tokens/API keys
          - direct access to data, backup, diagnostics and help-screenshot folders

          Intentionally deferred:
          - package installer with Portable / Einzelplatz / Engineering selection
          - final application icon rollout

          These will be implemented after functional and bug validation.
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_21_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_21_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_21_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_21'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_21_SingleFile_win-x64/*' $payload -Recurse -Force

          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.21'
            revision = 'R001.21'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.21: zentralisierte Versionskennzeichnung und neuer Bedien-/Supportbereich mit Systemprüfung, Sicherung und Diagnosepaket.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_21_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_21_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_21_SingleFile_win-x64
          path: artifacts/Partcounter_R001_21_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_21_Engineering
          path: artifacts/Engineering_R001_21
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_21_UpdatePackage
          path: artifacts/UpdatePackage_R001_21
          if-no-files-found: error
          retention-days: 30
