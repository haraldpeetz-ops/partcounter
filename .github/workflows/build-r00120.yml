name: Build Partcounter R001.20

on:
  push:
    branches: [ r001.20-auto-doc-capture ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_20_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_20_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_20_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_20_SingleFile_win-x64'
          )

          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md "$target/Engineering/" -Force
          }

          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_20' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_20/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_20/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md 'artifacts/Engineering_R001_20/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.20
          ===================

          New in R001.20:
          - one-click automatic original screenshot capture from the running WPF application
          - help center button 'Screenshots automatisch erstellen'
          - automatic PNG package for the most important help/manual views
          - automatic ZIP documentation package and capture manifest
          - external screenshot directory immediately consumed by the integrated help
          - controlled ALS diagnostic screenshot without creating a real connection failure
          - automatic UI redaction of sensitive production, network, authentication and printer values
          - no automatic unlocking of protected administration tabs
          - no Modbus write commands during documentation capture

          Screenshot output:
          %LOCALAPPDATA%\Partcounter\HelpScreenshots

          Documentation ZIPs:
          %LOCALAPPDATA%\Partcounter\DocumentationPackages

          Retained:
          - R001.19 professional formatted F1 context help
          - R001.18 ALS binding hotfix and immutable label layout snapshots
          - R001.17 label reprint and journal
          - R001.16 read-only live commissioning
          - Modbus Protocol V2 and Partcounter_LOGO_V001 unchanged
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_20_SingleFile_win-x64/START_HINWEIS.txt

          Copy-Item artifacts/Partcounter_R001_20_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_20_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_20'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_20_SingleFile_win-x64/*' $payload -Recurse -Force

          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.20'
            revision = 'R001.20'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.20: automatische Original-Screenshot-Erfassung für Hilfe und Handbuch mit ZIP-Paket, kontrollierter ALS-Fehleransicht und Datenschutz-Redaktion.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_20_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_20_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_20_SingleFile_win-x64
          path: artifacts/Partcounter_R001_20_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_20_Engineering
          path: artifacts/Engineering_R001_20
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_20_UpdatePackage
          path: artifacts/UpdatePackage_R001_20
          if-no-files-found: error
          retention-days: 30
