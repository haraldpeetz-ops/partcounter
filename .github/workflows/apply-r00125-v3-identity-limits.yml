name: Apply R001.25 recovery safety guard

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-recovery-safety:
    if: contains(github.event.head_commit.message, '[apply-recovery-safety]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recovery identity safety fixes
        shell: pwsh
        run: python tools/apply_r00125_recovery_safety_fix.py

      - name: Commit hardened product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: preserve uncertain activation and reject foreign recovery state [recovery-safety-applied]"
          git push
