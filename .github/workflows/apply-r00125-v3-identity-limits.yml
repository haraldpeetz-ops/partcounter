name: Finalize R001.25 repository cleanup

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[final-cleanup]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-shot hardening infrastructure and historical CI workflows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $remove = @()
          $remove += Get-ChildItem '.github/workflows' -File -Filter 'apply-r00125-*.yml' -ErrorAction SilentlyContinue
          $remove += Get-ChildItem '.github/workflows' -File -Filter 'bootstrap-r00125-hardening.yml' -ErrorAction SilentlyContinue
          $remove += Get-ChildItem '.github/workflows' -File -Filter 'build-r001*.yml' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'build-r00125.yml' }

          foreach ($file in ($remove | Sort-Object FullName -Unique)) {
            git rm -- $file.FullName
          }

          if (Test-Path 'tools') {
            git rm -r -- 'tools'
          }

          $legacyHelp = @(
            'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_14.md',
            'src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md'
          )
          foreach ($file in $legacyHelp) {
            if (Test-Path $file) { git rm -- $file }
          }

          $remainingBuilds = Get-ChildItem '.github/workflows' -File -Filter 'build-r001*.yml' | Select-Object -ExpandProperty Name
          if (@($remainingBuilds).Count -ne 1 -or $remainingBuilds[0] -ne 'build-r00125.yml') {
            throw "Unexpected remaining revision build workflows: $($remainingBuilds -join ', ')"
          }

          if (Test-Path 'tools') { throw 'Temporary tools directory still exists.' }

      - name: Commit clean release-candidate repository
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          if (git diff --cached --quiet) { throw 'Cleanup generated no tracked changes.' }
          git commit -m "chore: clean R001.25 release-candidate repository [cleanup-applied]"
          git push
