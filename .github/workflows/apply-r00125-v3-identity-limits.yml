name: Apply R001.25 recovery compile fix

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-recovery-compile-fix:
    if: contains(github.event.head_commit.message, '[apply-recovery-compile-fix]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recovery compile fix
        shell: pwsh
        run: python tools/apply_r00125_recovery_compile_fix.py

      - name: Commit corrected product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: checkpoint VE recovery at the correct completion boundary [recovery-compile-fix]"
          git push
