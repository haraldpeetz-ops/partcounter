name: Apply R001.25 V3 JobId echo

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-v3-jobid:
    if: contains(github.event.head_commit.message, '[apply-v3-jobid]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused V3 JobId echo patch
        shell: pwsh
        run: python tools/apply_r00125_jobid_echo.py

      - name: Commit hardened product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: add Protocol V3 JobId echo validation [v3-jobid-applied]"
          git push
