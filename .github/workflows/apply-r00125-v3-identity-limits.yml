name: Apply R001.25 recovery hold isolation

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-recovery-hold-isolation:
    if: contains(github.event.head_commit.message, '[apply-recovery-hold-isolation]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recovery hold and snapshot isolation hardening
        shell: pwsh
        run: python tools/run_r00125_recovery_hold_isolation.py

      - name: Commit hardened product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: isolate recovery snapshots and prove held boundary release [recovery-hold-isolation-applied]"
          git push
