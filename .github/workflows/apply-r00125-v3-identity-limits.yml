name: Apply R001.25 manual VE fail-safe

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-manual-ve:
    if: contains(github.event.head_commit.message, '[apply-manual-ve]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply manual VE fail-safe hardening
        shell: pwsh
        run: python tools/apply_r00125_manual_ve_hardening.py

      - name: Commit hardened product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: make manual VE changes fail-safe and replan boundaries [manual-ve-applied]"
          git push
