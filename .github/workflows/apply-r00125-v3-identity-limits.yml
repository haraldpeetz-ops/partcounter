name: Apply R001.25 unique job-instance identity

on:
  push:
    branches: [ r001.25-final-hardening ]

permissions:
  contents: write

jobs:
  apply-job-instance-id:
    if: contains(github.event.head_commit.message, '[apply-job-instance-id]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unique job-instance identity hardening
        shell: pwsh
        run: python tools/apply_r00125_job_instance_id.py

      - name: Commit hardened product source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          if (git diff --cached --quiet) { throw 'No product changes generated.' }
          git commit -m "fix: use unique persisted LOGO job-instance identity [job-instance-applied]"
          git push
