name: Build Partcounter R001.23

on:
  push:
    branches: [ r001.23-stress-proalpha ]
  workflow_dispatch:

jobs:
  build-stress-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Partcounter.sln

      - name: Build Release
        run: dotnet build Partcounter.sln -c Release --no-restore

      - name: Publish portable folder win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_23_Portable_Folder_win-x64

      - name: Publish single-file win-x64
        run: dotnet publish src/Partcounter.App/Partcounter.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Partcounter_R001_23_SingleFile_win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Real WPF simulation stress test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/Stress_R001_23' | Out-Null
          $exe = (Resolve-Path 'artifacts/Partcounter_R001_23_Portable_Folder_win-x64/Partcounter.exe').Path
          $report = (Join-Path (Resolve-Path 'artifacts/Stress_R001_23').Path 'STRESS_REPORT_R001_23.txt')
          $process = Start-Process -FilePath $exe -ArgumentList '--stress-smoke', "--stress-report=$report" -PassThru
          if (-not $process.WaitForExit(240000)) {
            try { $process.Kill($true) } catch {}
            throw 'Partcounter stress test exceeded 240 seconds.'
          }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Stress report missing. ExitCode=$($process.ExitCode)"
          }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Partcounter stress test failed with ExitCode $($process.ExitCode)."
          }
          if (-not (Select-String -LiteralPath $report -Pattern 'Ergebnis: PASS' -Quiet)) {
            throw 'Stress report did not contain PASS.'
          }

      - name: Add engineering and documentation package
        shell: pwsh
        run: |
          $targets = @(
            'artifacts/Partcounter_R001_23_Portable_Folder_win-x64',
            'artifacts/Partcounter_R001_23_SingleFile_win-x64'
          )
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path "$target/Engineering" | Out-Null
            Copy-Item docs/*.md "$target/Engineering/" -Force
            Copy-Item docs/logo_v001 "$target/Engineering/LOGO_V001" -Recurse -Force
            Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md "$target/Engineering/" -Force
            Copy-Item artifacts/Stress_R001_23/STRESS_REPORT_R001_23.txt "$target/Engineering/" -Force
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/Engineering_R001_23' | Out-Null
          Copy-Item docs/*.md 'artifacts/Engineering_R001_23/' -Force
          Copy-Item docs/logo_v001 'artifacts/Engineering_R001_23/LOGO_V001' -Recurse -Force
          Copy-Item src/Partcounter.App/Help/PARTCOUNTER_HILFE_R001_19.md 'artifacts/Engineering_R001_23/' -Force
          Copy-Item artifacts/Stress_R001_23/STRESS_REPORT_R001_23.txt 'artifacts/Engineering_R001_23/' -Force

      - name: Add start instructions
        shell: pwsh
        run: |
          @'
          PARTCOUNTER R001.23
          ===================

          R001.23 focuses on runtime stability and production-order interfaces.
          - automated real WPF simulation stress run with 30 machines
          - repeated order/VE completion load through the normal MainViewModel + SQLite path
          - stress report included in Engineering
          - proALPHA added as selectable alternative production-order source to ARBURG ALS
          - extended connection preflight to prevent missing access parameters during first commissioning
          - central version handling from R001.21/R001.22 retained

          No Modbus writes are sent during the automated stress test.
          '@ | Set-Content -Encoding UTF8 artifacts/Partcounter_R001_23_SingleFile_win-x64/START_HINWEIS.txt
          Copy-Item artifacts/Partcounter_R001_23_SingleFile_win-x64/START_HINWEIS.txt artifacts/Partcounter_R001_23_Portable_Folder_win-x64/START_HINWEIS.txt

      - name: Create standardized update package
        shell: pwsh
        run: |
          $package = 'artifacts/UpdatePackage_R001_23'
          $payload = "$package/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'artifacts/Partcounter_R001_23_SingleFile_win-x64/*' $payload -Recurse -Force
          $payloadRoot = (Resolve-Path $payload).Path
          $hashLines = Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -LiteralPath "$package/payload-sha256.txt" -Encoding ASCII
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Partcounter'
            version = '0.1.23'
            revision = 'R001.23'
            architecture = 'win-x64'
            payloadRoot = 'payload/'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            releaseNotes = 'R001.23: Laufzeit-Stresstest und proALPHA-Auftragsintegration als wählbare Alternative zu ARBURG ALS mit erweitertem Verbindungs-Preflight.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$package/partcounter-update.json" -Encoding UTF8

      - name: Upload stress artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_23_StressReport
          path: artifacts/Stress_R001_23
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_23_Portable_Folder_win-x64
          path: artifacts/Partcounter_R001_23_Portable_Folder_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_23_SingleFile_win-x64
          path: artifacts/Partcounter_R001_23_SingleFile_win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_23_Engineering
          path: artifacts/Engineering_R001_23
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Partcounter_R001_23_UpdatePackage
          path: artifacts/UpdatePackage_R001_23
          if-no-files-found: error
          retention-days: 30
