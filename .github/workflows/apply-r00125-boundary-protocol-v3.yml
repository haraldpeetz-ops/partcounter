Die R001.25-Gesamtprüfung hat einen Race-Case im früheren PC-seitigen „Completion → Pause“-Ablauf identifiziert. Für eine echte Industrieanwendung wird dieser nicht toleriert. R001.25 hebt deshalb den Live-Modbusvertrag auf Protocol V3 an, ohne bestehende Adressen zu verschieben. HR13 plant die erste kritische VE (`HoldAfterVeNumber`), HR38 bestätigt sie. Die LOGO! muss an dieser Grenze lokal `CompletionHoldActive` latchen, bevor CompletionSequence veröffentlicht wird. Alte V2-LOGO-Programme werden absichtlich abgewiesen.
