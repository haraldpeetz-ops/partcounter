          write('docs/MODBUS_REGISTER_MAP.md', r'''# Partcounter Modbus TCP – Registerplan Protocol V3 (R001.25)

## Grundsatz
NModbus adressiert Holding Register nullbasiert. PC-Offset 0 entspricht LOGO! HR1 / VW0.
Protocol V3 erweitert V2 additiv: kein bestehendes Register wird verschoben. Neu sind nur HR13 (`HoldAfterVeNumber`) und HR38 (`HoldAfterVeNumberEcho`) sowie zwei Statusbits.

## PC → LOGO! Konfigurationspuffer
| HR | Offset | LOGO VM | Inhalt |
|---:|---:|---:|---|
| 1 | 0 | VW0 | ProtocolVersion = 3 |
| 2 | 1 | VW2 | CommandSequence 1..32767 |
| 3 | 2 | VW4 | CommandWord |
| 4 | 3 | VW6 | ActiveCavities 1..64 |
| 5–6 | 4–5 | VD8 | TargetPartsPerVE UInt32 |
| 7 | 6 | VW12 | ValvePulse / 10 ms |
| 8–9 | 7–8 | VD14 | JobId UInt32 |
| 10–11 | 9–10 | VD18 | TargetCyclesPerVE UInt32, LOGO-Bereich 1..32767 |
| 12 | 11 | VW22 | PcHeartbeat 1..32767 |
| **13** | **12** | **VW24** | **HoldAfterVeNumber 0..32767** |

`HoldAfterVeNumber=0` bedeutet kein geplanter Completion-Hold. Im normalen Produktionsauftrag liefert Partcounter immer einen konkreten Grenzpunkt. Die LOGO! übernimmt den Wert nur zusammen mit einer neuen `CommandSequence` und bestätigt ihn über HR38.

## LOGO! → PC Statuspuffer
StatusStart bleibt HR20 / Offset 19.
| HR | Offset | LOGO VM | Inhalt |
|---:|---:|---:|---|
| 20 | 19 | VW38 | ProtocolVersion = 3 |
| 21 | 20 | VW40 | StatusWord |
| 22–23 | 21–22 | VD42 | CurrentVECycles |
| 24–25 | 23–24 | VD46 | TotalCycles |
| 26 | 25 | VW50 | CurrentVENumber |
| 27 | 26 | VW52 | CompletedVEs |
| 28–29 | 27–28 | VD54 | LastCompletedVECycles |
| 30 | 29 | VW58 | AckSequence |
| 31 | 30 | VW60 | ActiveCavitiesEcho |
| 32 | 31 | VW62 | LastCompletedVENumber |
| 33 | 32 | VW64 | CompletionSequence |
| 34 | 33 | VW66 | LogoHeartbeat |
| 35 | 34 | VW68 | ErrorCode |
| 36 | 35 | VW70 | LastCompletionReason |
| 37 | 36 | VW72 | LastCompletedCavities |
| **38** | **37** | **VW74** | **HoldAfterVeNumberEcho** |

## CommandWord
- Bit 0: EnableAutomatic
- Bit 1: ResetJob
- Bit 2: ManualVeChange
- Bit 3: AcknowledgeAlarm
- Bit 4: PauseCounting

## StatusWord
- Bit 0: Ready
- Bit 1: AutomaticEnabled
- Bit 2: VeChangeActive
- Bit 3: Alarm
- Bit 4: CycleInputActive
- Bit 5: PcHeartbeatStale
- **Bit 6: CompletionHoldArmed** – ein Grenzpunkt > 0 ist übernommen
- **Bit 7: CompletionHoldActive** – Grenzpunkt wurde erreicht; Zählung ist hardwareseitig gesperrt

## Command/Ack-Regel
Ein Befehl wird nur bei `CommandSequence != AckSequence` verarbeitet. Nach vollständiger Validierung und Übernahme aller Parameter schreibt die LOGO! `AckSequence = CommandSequence`. Ein Retry mit derselben Sequenz darf keinerlei One-Shot erneut auslösen. Partcounter wertet einen Konfigurationsbefehl erst als erfolgreich, wenn AckSequence, ErrorCode, ActiveCavitiesEcho **und HoldAfterVeNumberEcho** passen.

## Sicherheitsregel VE-Grenze
Der Grenzhalt wird **vor** Beginn der Produktionsstrecke geplant. Bei Erreichen von `CurrentVENumber == HoldAfterVeNumber` muss die LOGO! im selben Programmscan, in dem sie die VE als fertig erkennt, zuerst den Completion-Hold latchen und den Zykluszähleingang für die Folge-VE sperren. Erst danach werden CompletionSequence/Status veröffentlicht. Der Hold darf nur nach bestätigter Übernahme des nächsten VE-Ziels und einem separaten Resume gelöst werden.
''')

          write('docs/LOGO_CONTROL_LOGIC.md', r'''# Partcounter LOGO! Steuerlogik – Protocol V3 / R001.25

## Sicherheitsziel
Die Siemens LOGO! zählt und wechselt Verpackungseinheiten lokal. PC- oder WLAN-Ausfall darf gleichartige Standard-VE nicht stoppen. An einer Stelle, an der das nächste VE-Ziel geändert werden muss oder der Auftrag endet, darf dagegen kein einziger Folgezyklus in eine falsche VE laufen.

## Zustände
1. **RUN** – Zyklusimpulse werden gezählt.
2. **VE_CHANGE** – Ziel erreicht, Abschlussdaten werden eingefroren, Q3/Wechsler wird ausgelöst.
3. **COMPLETION_HOLD** – nur wenn die fertige VE dem geplanten `HoldAfterVeNumber` entspricht; Zykluszählen bleibt gesperrt.
4. **PAUSE/FAULT** – Zählen gesperrt durch PC-Pause oder Fehler.

## Protocol-V3-Grenzhalt
Partcounter berechnet bereits vor Produktionsbeginn die erste kritische VE. Beispiel: 10 gleiche Voll-VE und anschließend eine Teil-VE → `HoldAfterVeNumber=10`. VE 1 bis 9 laufen ohne PC-Eingriff. Bei Abschluss VE 10:
- Abschlusswerte `LastCompleted...` speichern,
- `CompletionHoldActive` **sofort latchen**,
- Zähleingang der nächsten VE sperren,
- VE-Wechsler auslösen,
- CompletionSequence genau einmal erhöhen,
- Status veröffentlichen.

Der PC erkennt die CompletionSequence, prüft `CompletionHoldActive`, schreibt Ziel und neuen `HoldAfterVeNumber`, wartet auf Ack + Echo und sendet erst danach Resume. Das Resume löscht den Hold-Latch.

## Reihenfolge im LOGO!-Netzwerk
Die konkrete Blockreihenfolge muss logisch folgende Priorität abbilden:
1. Protokoll-/Parameterprüfung bei neuer CommandSequence.
2. Parameter atomar in Arbeitswerte übernehmen; HR38-Echo setzen; AckSequence zuletzt setzen.
3. CycleInput nur freigeben, wenn AutomaticEnabled UND nicht PauseCounting UND nicht Alarm UND nicht CompletionHoldActive UND nicht VE_CHANGE.
4. Bei Zielerreichung LastCompleted-Zähler/Kavitäten/VE-Nummer einfrieren.
5. Falls fertige VE = HoldAfterVeNumber: Hold-Latch im selben Scan setzen.
6. VE-Wechsler auslösen und CurrentVE/CompletedVE aktualisieren.
7. CompletionSequence einmalig erhöhen.
8. Erst bei bestätigtem Resume Hold-Latch zurücksetzen.

## Kommunikationsausfall
`PcHeartbeatStale` bleibt Diagnose. Er stoppt die Produktion nicht pauschal. Die geplante Grenze ist bereits lokal in der LOGO! gespeichert; daher kann die LOGO! bei Netzausfall bis zu dieser Grenze autonom weiterproduzieren und hält dort deterministisch.

## Unzulässiger Mischbetrieb
Partcounter R001.25 verlangt ProtocolVersion 3. Eine LOGO! mit Protocol V2 wird absichtlich abgewiesen. Dadurch kann eine alte Logik den neuen Sicherheitsmechanismus nicht stillschweigend ignorieren.
''')

          write('docs/logo_v001/LOGO_V001_R001_25_COMMAND_ACK_AND_VE_BOUNDARY.md', r'''# LOGO V001 – R001.25 Command/Ack und sichere VE-Grenze

## Änderung gegenüber R001.24
Die frühere PC-Reihenfolge „Completion erkennen → Pause senden“ ist für sehr schnelle Folgezyklen nicht hinreichend deterministisch. R001.25 verwendet deshalb **Modbus Protocol V3** und einen vorab in der LOGO! gespeicherten Grenzpunkt.

- bestehende V2-Adressen bleiben unverändert,
- neu: HR13 / VW24 `HoldAfterVeNumber`,
- neu: HR38 / VW74 `HoldAfterVeNumberEcho`,
- neu: StatusWord Bit 6 `CompletionHoldArmed`, Bit 7 `CompletionHoldActive`,
- ProtocolVersion = 3.

## Command/Ack
One-Shot-Bits werden nur bei `CommandSequence != AckSequence` verarbeitet. Erst nach vollständiger Parameterprüfung/-übernahme werden Echo-Werte und zuletzt `AckSequence` aktualisiert. Ein Retry mit derselben Sequenz darf keinen One-Shot wiederholen.

## Grenzalgorithmus
Partcounter plant die **erste** VE, nach der PC-Interaktion zwingend ist:
- Auftragsende, oder
- Wechsel von der Standard-VE auf eine abweichende letzte Teil-VE.

Diese VE-Nummer wird mit dem Auftrag geschrieben und per HR38 bestätigt. Bis dahin läuft die LOGO! autonom.

## Verhalten beim Grenzabschluss
Wenn die fertige VE = `HoldAfterVeNumber` ist, muss die LOGO! den Completion-Hold im selben Scan vor Freigabe eines Folgezyklus latchen. `CompletionSequence` darf erst veröffentlicht werden, nachdem der Hold aktiv ist. Partcounter akzeptiert den Grenzabschluss nur, wenn StatusWord Bit 7 aktiv ist; andernfalls wird ein Fail-Safe-Pausebefehl gesendet und ein `SAFETY_VE_BOUNDARY_STOP` protokolliert.

## Fortsetzung nach Grenzhalt
1. PC schreibt das nächste VE-Ziel und den nächsten `HoldAfterVeNumber` mit neuer CommandSequence und `PauseCounting`.
2. LOGO! validiert alles, setzt HR38-Echo und AckSequence.
3. PC prüft Ack, ErrorCode=0, Kavitäten-Echo und Hold-Echo.
4. PC sendet Resume; erst dieses Signal löscht den Completion-Hold.

## Reale Abnahme M01
Pflichtfälle: verlorene TCP-Antwort nach Write, Retry ohne Doppel-One-Shot, WLAN-Ausfall vor Grenz-VE, WLAN-Ausfall genau an Grenz-VE, Voll→Teil-VE, finaler Auftragsabschluss, 64 Kavitäten mit Überfüllung, Ack-Wrap 32767→1. Kein Test gilt als bestanden, wenn nach aktivem Grenzhalt ein weiterer Zyklus gezählt wird.
''')

