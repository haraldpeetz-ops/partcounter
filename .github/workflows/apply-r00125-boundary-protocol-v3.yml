name: Apply R001.25 Protocol V3 boundary hardening

on:
  push:
    branches:
      - r001.25-final-hardening

permissions:
  contents: write

jobs:
  apply-boundary:
    if: "${{ contains(github.event.head_commit.message, '[apply-boundary]') }}"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Protocol V3 boundary patch
        shell: pwsh
        run: python tools/apply_r00125_boundary_v3.py

      - name: Commit hardened source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "fix: Protocol V3 deterministic VE boundary hold [boundary-applied]"
          git push origin HEAD:r001.25-final-hardening

  apply-refinement:
    if: "${{ contains(github.event.head_commit.message, '[apply-refine]') }}"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Protocol V3 boundary refinements
        shell: pwsh
        run: python tools/apply_r00125_boundary_refinement.py

      - name: Commit refined source
        shell: pwsh
        run: |
          git config user.name "partcounter-ci"
          git config user.email "partcounter-ci@users.noreply.github.com"
          git add src tests docs
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "fix: harden VE boundary precheck and LOGO capacity [refine-applied]"
          git push origin HEAD:r001.25-final-hardening
