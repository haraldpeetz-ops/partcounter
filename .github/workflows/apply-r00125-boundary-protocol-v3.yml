          write('docs/logo_v001/LOGO_V001_R001_25_PROTOCOL_V3_IMPLEMENTATION.md', r'''# Partcounter LOGO V001 – R001.25 Protocol V3 Implementierungsblatt

Dieses Blatt ersetzt für R001.25 die V2-Grenzlogik aus R001.24. Die bestehenden V2-Netzwerke bleiben funktional erhalten; zwei VM-Wörter und zwei Statusbits werden ergänzt.

## 1. VM-Zuordnung ergänzen
- VW24 / HR13: `HoldAfterVeNumber` (0..32767)
- VW74 / HR38: `HoldAfterVeNumberEcho` (0..32767)
- VW38/HR20 ProtocolVersion auf 3 setzen.
- StatusWord VW40: Bit6 `CompletionHoldArmed`, Bit7 `CompletionHoldActive`.

## 2. Command-Accept-Netzwerk
Bei neuer CommandSequence:
1. ProtocolVersion=3 prüfen.
2. Kavitäten 1..64, TargetCycles 1..32767, ValvePulse 5..500 und HoldAfterVeNumber 0..32767 prüfen.
3. Alle Werte in die internen Arbeitswerte übernehmen.
4. `HoldAfterVeNumberEcho := HoldAfterVeNumber`.
5. `CompletionHoldArmed := HoldAfterVeNumber > 0`.
6. Erst danach `AckSequence := CommandSequence`.

Bei ungültigem Parameter Ack nicht als Erfolg ausgeben; ErrorCode setzen. Ein identischer CommandSequence-Wert wird nicht erneut ausgeführt.

## 3. Zählfreigabe
Der Zykluszähler erhält nur dann einen Impuls, wenn gleichzeitig gilt:
`AutomaticEnabled AND NOT PauseCounting AND NOT Alarm AND NOT VeChangeActive AND NOT CompletionHoldActive`.

Damit ist `CompletionHoldActive` eine echte lokale Verriegelung und keine reine PC-Anzeige.

## 4. VE-Abschluss-Netzwerk – Scanreihenfolge
Bei Erreichen TargetCycles:
1. `LastCompletedVECycles`, `LastCompletedCavities`, `LastCompletedVENumber`, `LastCompletionReason` einfrieren.
2. Vergleichen: `LastCompletedVENumber == HoldAfterVeNumberEcho` und HoldAfterVeNumberEcho > 0.
3. Wenn wahr: `CompletionHoldActive` **setzen/latchen**.
4. Erst danach VE-Wechsler/Q3 triggern und Zähler/VE-Nummern aktualisieren.
5. `CompletionSequence` exakt einmal erhöhen.

Wichtig: Das Latch muss im Signalpfad vor der Freigabe des nächsten CycleInput liegen. Ein schneller Maschinenimpuls nach VE-Abschluss darf deshalb nicht als erster Zyklus einer neuen VE durchlaufen.

## 5. Resume
Ein bestätigter Resume-Befehl darf `CompletionHoldActive` nur löschen, wenn zuvor ein V3-Konfigurationsbefehl mit gültigem Ack verarbeitet wurde. Empfohlen: internes Flag `ConfigAcceptedSinceHold`; beim Setzen des Holds löschen, bei erfolgreicher Konfigurationsübernahme setzen, Resume nur bei diesem Flag wirksam machen. Danach Flag wieder löschen.

## 6. PC-Ausfall
PcHeartbeatStale bleibt Diagnose. Die Produktion läuft bis zum bereits gespeicherten HoldAfterVeNumber weiter. Dort bleibt sie stehen, bis der PC wieder erreichbar ist und eine bestätigte Folgekonfiguration liefert.

## 7. M01-Abnahme
Alle Fälle aus `LOGO_V001_TEST_CASES_R001_25.csv` durchführen. Besonders V3-05 ist zwingend mit einem realen schnellen CycleInput zu prüfen. Erst wenn nach dem Grenzabschluss garantiert kein Folgeimpuls gezählt wird, darf M01 freigegeben werden.
''')

